[project]
name = "currency-crypto-scout"
version = "1.0.0"
description = "Сбор котировок криптовалют и фиатных валют из публичных API, витрина данных, ИИ-планирование запросов и аудит"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
